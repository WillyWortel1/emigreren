<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Emigreren</title>
    <meta name="description" content="Stappenplan, afvinklijst en e-mails voor emigreren vanuit Nederland." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <h1>Emigreren</h1>
        <p>Stappenplan · afvinklijst · fiscaal · e-mails</p>
      </div>
      <div class="progress-meta">
        <div id="progress-days">—</div>
        <div id="progress-label">—</div>
        <div class="progress-bar"><span></span></div>
      </div>
    </header>
    <nav class="tabs">
      <button data-tab="plan" class="active">Stappenplan</button>
      <button data-tab="lijst">Afvinklijst</button>
      <button data-tab="fiscaal">Fiscaal</button>
      <button data-tab="mail">E-maillijst</button>
      <button data-tab="info">Spelregels</button>
    </nav>
    <main id="view"></main>
    <p class="disclaimer" style="padding: 0 28px 40px; max-width: 1100px; margin: 0 auto">
      Geen fiscaal of juridisch advies. Controleer termijnen altijd op belastingdienst.nl, nederlandwereldwijd.nl, svb.nl en bij je gemeente.
    </p>
    <script src="data.js"></script>
    <script src="fiscal.js"></script>
    <script src="app.js"></script>
  </body>
</html>
