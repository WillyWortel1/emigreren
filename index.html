<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Emigreren</title>
    <meta name="description" content="Stappenplan, afvinklijst en e-mails voor emigreren vanuit Nederland." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;0,900&display=swap" />
    <link rel="stylesheet" href="styles.css?v=33" />
    <script>
      try {
        if (localStorage.getItem("emigreren-theme") === "dark") {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <header class="app-header">
      <div class="header-row">
        <div class="brand">
          <span class="mark" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <rect x="3.2" y="2.8" width="13.6" height="14.4" rx="1.6" fill="var(--primary-fg)"/>
              <path d="M6.2 7.2h7.6M6.2 10.2h7.6M6.2 13.2h4.6" stroke="var(--primary)" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
          </span>
          <h1>Emigreren</h1>
        </div>
        <div class="header-meta">
          <div class="progress-meta">
            <div id="progress-days">—</div>
            <div id="progress-label">—</div>
            <div class="progress-bar"><span></span></div>
          </div>
        </div>
      </div>
      <nav class="tabs">
        <button data-tab="plan" class="active">Stappenplan</button>
        <button data-tab="lijst">Afvinklijst</button>
        <button data-tab="fiscaal">Fiscaal</button>
        <button data-tab="mail">E-maillijst</button>
        <button data-tab="sociaal">Sociaal</button>
        <button data-tab="info">Spelregels</button>
        <span class="tab-actions">
          <button class="tab-icon" id="reload-app" type="button" title="Vernieuwen" aria-label="Vernieuwen">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-2.2-5.8"/>
              <path d="M21 3v6h-6"/>
            </svg>
          </button>
          <button class="tab-reset" id="reset-data" type="button">Wissen</button>
          <button class="icon-btn" id="theme-toggle" type="button" aria-label="Thema">
            <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
              <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
            </svg>
            <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" style="display:none">
              <path d="M21 14.3A8.5 8.5 0 1 1 9.7 3a7 7 0 0 0 11.3 11.3z"/>
            </svg>
          </button>
        </span>
      </nav>
    </header>
    <main id="view"></main>
    <p class="site-footer"><a href="https://www.willemvroom.nl" target="_blank" rel="noopener">willemvroom.nl</a></p>
    <script src="data.js?v=33"></script>
    <script src="fiscal.js?v=33"></script>
    <script src="app.js?v=33"></script>
  </body>
</html>
